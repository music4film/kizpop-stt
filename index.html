<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIZPOP STT & TRANSLATOR ULTRA v10</title>
<style type="text/css">
body {
  background: #0f0f0f;
  color: #ffffff;
  font-family: 'Pretendard', Arial, sans-serif;
  padding: 20px;
  margin: 0;
}

/* TITLE */
h2 {
  margin-bottom: 8px;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 0.6px;
  color: #ffffff;
  text-align: center;
}

h2::before {
  content: "● ";
  color: #ff3d00;
}

/* CONTROLS & STATUS */
.status-bar {
  text-align: center;
  margin-bottom: 15px;
}

.status {
  font-size: 13px;
  opacity: 0.75;
  margin-bottom: 10px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  background: #2a2a2a;
  color: #fff;
  border: 1px solid #444;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: bold;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.2s;
}

.btn:hover {
  background: #3a3a3a;
}

.btn-toggle {
  background: #ff3d00;
  border: none;
}

.btn-toggle.active {
  background: #00c853;
}

.btn-download {
  background: #2962ff;
  border: none;
}

.btn-download:hover {
  background: #1e88e5;
}

.btn-dict {
  background: #ab47bc;
  border: none;
}

.btn-dict:hover {
  background: #8e24aa;
}

.lang-select {
  background: #2a2a2a;
  color: #fff;
  border: 1px solid #444;
  padding: 9px 16px;
  font-size: 14px;
  border-radius: 20px;
  outline: none;
  cursor: pointer;
}

/* DICTIONARY PANEL */
#dictModal {
  display: none;
  max-width: 900px;
  margin: 15px auto 0 auto;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 15px;
}

.dict-form {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.dict-input {
  background: #2a2a2a;
  border: 1px solid #444;
  color: #fff;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  flex: 1;
  min-width: 140px;
}

.dict-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  max-height: 120px;
  overflow-y: auto;
}

.dict-item {
  background: #2d2d2d;
  border: 1px solid #444;
  padding: 4px 10px;
  border-radius: 15px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.dict-item .del-btn {
  color: #ff5252;
  cursor: pointer;
  font-weight: bold;
}

/* TEXT AREA */
#lines {
  margin-top: 15px;
  max-width: 900px;
  height: 500px;
  overflow-y: auto;
  border: 1px solid #333;
  padding: 15px;
  margin-left: auto;
  margin-right: auto;
  border-radius: 8px;
  background: #141414;
}

/* CAPTION LINE */
.line {
  background: #1e1e1e;
  color: #ffffff;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: background 0.15s;
  font-size: 18px;
  line-height: 1.4;
  white-space: pre-line;
  word-break: keep-all;
  position: relative;
}

.line:hover {
  background: #2962ff;
}

.time-tag {
  font-size: 11px;
  color: #ff3d00;
  font-weight: bold;
  margin-bottom: 4px;
  display: block;
}

.trans-text {
  display: block;
  font-size: 14px;
  color: #ffca28;
  margin-top: 4px;
  font-weight: normal;
}

.copied {
  background: #00c853 !important;
}

.new {
  outline: 2px solid #ffaa00;
}

.live {
  opacity: 0.5;
  font-style: italic;
  border-left: 3px solid #ff3d00;
  padding-left: 10px;
  background: transparent;
}
</style>
</head>
<body>

<h2><span style="color:#999999;">KIZPOP STT & TRANSLATOR ULTRA v10</span></h2>

<div class="status-bar">
  <div class="status">Real-time STT / Custom Dict UI / Silence Cut SRT</div>
  <div class="controls">
    <button id="startBtn" class="btn btn-toggle" onclick="toggleSTT()">음성 인식 시작</button>
    <select id="targetLang" class="lang-select">
      <option value="none">번역 안 함 (한국어만)</option>
      <option value="en" selected>영어 (English)</option>
      <option value="ja">일본어 (日本語)</option>
      <option value="zh-CN">중국어 - 간체 (簡體字)</option>
      <option value="zh-TW">중국어 - 번체 (繁體字)</option>
      <option value="es">스페인어 (Español)</option>
      <option value="fr">프랑스어 (Français)</option>
      <option value="de">독일어 (Deutsch)</option>
      <option value="ar">아랍어 (العربية)</option>
      <option value="he">히브리어 / 이스라엘 (עברית)</option>
      <option value="th">태국어 (ไทย)</option>
      <option value="tl">필리핀어 / 타갈로그어 (Tagalog)</option>
      <option value="vi">베트남어 (Tiếng Việt)</option>
      <option value="id">인도네시아어 (Bahasa Indonesia)</option>
      <option value="ru">러시아어 (Русский)</option>
      <option value="it">이탈리아어 (Italiano)</option>
      <option value="pt">포르투갈어 (Português)</option>
      <option value="hi">힌디어 (हिन्दी)</option>
      <option value="tr">터키어 (Türkçe)</option>
      <option value="nl">네덜란드어 (Nederlands)</option>
      <option value="pl">폴란드어 (Polski)</option>
      <option value="sv">스웨덴어 (Svenska)</option>
      <option value="uk">우크라이나어 (Українська)</option>
      <option value="mn">몽골어 (Монгол)</option>
    </select>
    <button class="btn btn-dict" onclick="toggleDictUI()">교정 사전 설정</button>
    <button class="btn btn-download" onclick="exportSRT('ko')">SRT 받기 (원문)</button>
    <button class="btn btn-download" onclick="exportSRT('both')">SRT 받기 (통합)</button>
    <button class="btn" onclick="clearAllData()">초기화</button>
  </div>
</div>

<!-- CUSTOM DICTIONARY UI -->
<div id="dictModal">
  <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #ab47bc;">오인식 교정 사전 관리 (브라우저 자동 저장)</div>
  <div class="dict-form">
    <input type="text" id="wrongWord" class="dict-input" placeholder="틀린/잘못 들린 단어 (예: 아버지 가방에)">
    <input type="text" id="rightWord" class="dict-input" placeholder="올바른 단어 (예: 아버지가 방에)">
    <button class="btn" style="padding: 6px 14px; font-size: 12px;" onclick="addDictRule()">추가</button>
  </div>
  <div id="dictList" class="dict-list"></div>
</div>

<div id="lines"></div>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  alert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 또는 Edge 브라우저를 사용해 주세요.");
}

const recognition = new SpeechRecognition();
recognition.lang = "ko-KR";
recognition.continuous = true;
recognition.interimResults = true;
recognition.maxAlternatives = 1;

let isListening = false;
let textBuffer = "";
let liveLine = null;
let autoScroll = true;

let sessionStartTime = 0;
let chunkStartTime = 0;
let subtitleRecords = [];

const linesDiv = document.getElementById("lines");
const startBtn = document.getElementById("startBtn");
const targetLangSelect = document.getElementById("targetLang");

// --------------------------------------------------
// CUSTOM DICTIONARY SYSTEM (LOCAL STORAGE PERSISTENCE)
// --------------------------------------------------
const defaultDict = {
  "아버지 가방에": "아버지가 방에",
  "키즘팝": "키즈팝",
  "키즈 팝": "키즈팝",
  "보스샘": "뽀스쌤",
  "보스 쌤": "뽀스쌤",
  "베가스": "Vegas",
  "프리미어": "Premiere"
};

let customDictionary = JSON.parse(localStorage.getItem("kizpop_dict")) || defaultDict;

function saveDict() {
  localStorage.setItem("kizpop_dict", JSON.stringify(customDictionary));
  renderDict();
}

function toggleDictUI() {
  const modal = document.getElementById("dictModal");
  modal.style.display = (modal.style.display === "block") ? "none" : "block";
}

function renderDict() {
  const listDiv = document.getElementById("dictList");
  listDiv.innerHTML = "";
  for (const [wrong, right] of Object.entries(customDictionary)) {
    const item = document.createElement("div");
    item.className = "dict-item";
    item.innerHTML = `<span>${wrong} → <b style="color:#00c853;">${right}</b></span> <span class="del-btn" onclick="removeDictRule('${wrong}')">✕</span>`;
    listDiv.appendChild(item);
  }
}

function addDictRule() {
  const wrong = document.getElementById("wrongWord").value.trim();
  const right = document.getElementById("rightWord").value.trim();
  if (!wrong || !right) {
    alert("틀린 단어와 올바른 단어를 모두 입력해 주세요.");
    return;
  }
  customDictionary[wrong] = right;
  document.getElementById("wrongWord").value = "";
  document.getElementById("rightWord").value = "";
  saveDict();
}

function removeDictRule(key) {
  delete customDictionary[key];
  saveDict();
}

function applyCustomCorrections(text) {
  let corrected = text;
  for (const [wrong, right] of Object.entries(customDictionary)) {
    corrected = corrected.replaceAll(wrong, right);
  }
  return corrected;
}

// Initial Dict Render
renderDict();

// --------------------
// USER SCROLL LOCK
// --------------------
linesDiv.addEventListener("scroll", () => {
  const bottom = linesDiv.scrollHeight - linesDiv.scrollTop - linesDiv.clientHeight;
  autoScroll = bottom < 120;
});

// --------------------
// STT CONTROL
// --------------------
function toggleSTT() {
  if (isListening) {
    stopListening();
  } else {
    startListening();
  }
}

function startListening() {
  try {
    if (sessionStartTime === 0) {
      sessionStartTime = Date.now();
    }
    chunkStartTime = Date.now() - sessionStartTime;
    recognition.start();
    isListening = true;
    startBtn.innerText = "음성 인식 중 (정지)";
    startBtn.classList.add("active");
  } catch (e) {
    console.error("STT Start Error:", e);
  }
}

function stopListening() {
  isListening = false;
  recognition.stop();
  flushBuffer();
  startBtn.innerText = "음성 인식 시작";
  startBtn.classList.remove("active");
}

function clearAllData() {
  if (confirm("모든 자막과 타임코드 데이터를 초기화하시겠습니까?")) {
    linesDiv.innerHTML = "";
    subtitleRecords = [];
    sessionStartTime = 0;
    textBuffer = "";
  }
}

// --------------------
// LIVE DISPLAY
// --------------------
function showLive(text) {
  if (!liveLine) {
    liveLine = document.createElement("div");
    liveLine.className = "line live";
    linesDiv.appendChild(liveLine);
  }
  liveLine.innerText = applyCustomCorrections(text);

  if (autoScroll) {
    linesDiv.scrollTop = linesDiv.scrollHeight;
  }
}

function clearLive() {
  if (liveLine) {
    liveLine.remove();
    liveLine = null;
  }
}

// --------------------
// TRANSLATION
// --------------------
async function fetchTranslation(text, targetLang) {
  if (!targetLang || targetLang === "none" || !text.trim()) return "";
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
    const response = await fetch(url);
    const data = await response.json();
    return data[0].map(item => item[0]).join('');
  } catch (error) {
    console.error("Translation Error:", error);
    return "";
  }
}

// --------------------
// SMART KOREAN SPLIT ENGINE
// --------------------
function smartKoreanSplit(text) {
  const TARGET_LEN = 14;
  const MAX_LEN = 20;
  const words = text.split(/\s+/);
  const result = [];
  let current = "";

  const breakPattern = /(은|는|이|가|을|를|에서|에|과|와|으로|로|하고|는데|이고|해서|하며|있어|했습니다|입니다|[.,?!~])$/;

  for (let i = 0; i < words.length; i++) {
    const word = words[i];
    const candidate = (current + " " + word).trim();

    if (candidate.length > MAX_LEN) {
      if (current) result.push(current);
      current = word;
      continue;
    }

    if (candidate.length >= TARGET_LEN && breakPattern.test(word) && i < words.length - 1) {
      result.push(candidate);
      current = "";
      continue;
    }

    current = candidate;
  }

  if (current) result.push(current);
  return result;
}

// --------------------
// TIME FORMATTER
// --------------------
function formatSRTTime(ms) {
  let hrs = Math.floor(ms / 3600000);
  let mins = Math.floor((ms % 3600000) / 60000);
  let secs = Math.floor((ms % 60000) / 1000);
  let millis = Math.floor(ms % 1000);

  return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')},${String(millis).padStart(3, '0')}`;
}

// --------------------
// LINE & RECORD CREATION
// --------------------
async function createLine(text, startMs, endMs) {
  if (!text || text.trim() === "") return;

  const selectedLang = targetLangSelect.value;
  let transText = "";

  if (selectedLang !== "none") {
    transText = await fetchTranslation(text, selectedLang);
  }

  const record = {
    index: subtitleRecords.length + 1,
    startMs: startMs,
    endMs: endMs,
    ko: text,
    trans: transText
  };
  subtitleRecords.push(record);

  let div = document.createElement("div");
  div.className = "line new";

  let timeSpan = document.createElement("span");
  timeSpan.className = "time-tag";
  timeSpan.innerText = `[${formatSRTTime(startMs)} --> ${formatSRTTime(endMs)}]`;
  div.appendChild(timeSpan);

  let textNode = document.createTextNode(text);
  div.appendChild(textNode);

  if (transText) {
    let transSpan = document.createElement("span");
    transSpan.className = "trans-text";
    transSpan.innerText = transText;
    div.appendChild(transSpan);
  }

  div.onclick = function() {
    const copyContent = div.innerText;
    navigator.clipboard.writeText(copyContent).then(() => {
      div.classList.add("copied");
      setTimeout(() => div.classList.remove("copied"), 500);
    });
  };

  linesDiv.appendChild(div);
  setTimeout(() => div.classList.remove("new"), 800);

  if (autoScroll) {
    linesDiv.scrollTop = linesDiv.scrollHeight;
  }
}

// --------------------------------------------------
// SILENCE-AWARE OUT-POINT CUT ALGORITHM
// --------------------------------------------------
function flushBuffer() {
  if (textBuffer.trim().length === 0) return;

  let finalText = applyCustomCorrections(textBuffer.trim());
  textBuffer = "";

  const chunkEndMs = Date.now() - sessionStartTime;
  const lines = smartKoreanSplit(finalText);

  const totalDuration = Math.max(chunkEndMs - chunkStartTime, 1000);
  const totalChars = lines.reduce((sum, line) => sum + line.length, 0) || 1;

  let currentStart = chunkStartTime;

  lines.forEach((lineText) => {
    const charRatio = lineText.length / totalChars;
    let rawDuration = totalDuration * charRatio;

    let maxVoiceDuration = (lineText.length * 200) + 350;
    
    let lineDuration = Math.min(rawDuration, maxVoiceDuration);
    lineDuration = Math.max(lineDuration, 800);

    let lineEnd = currentStart + Math.round(lineDuration);
    if (lineEnd > chunkEndMs) lineEnd = chunkEndMs;

    createLine(lineText, currentStart, lineEnd);

    currentStart = lineEnd + 50;
  });

  chunkStartTime = chunkEndMs;
  clearLive();
}

// --------------------
// STT RESULT HANDLER
// --------------------
recognition.onresult = function(event) {
  for (let i = event.resultIndex; i < event.results.length; i++) {
    let transcript = event.results[i][0].transcript.trim();

    if (!event.results[i].isFinal) {
      showLive(transcript);
      continue;
    }

    clearLive();
    textBuffer += " " + transcript;
    textBuffer = textBuffer.trim();

    if (textBuffer.length > 18 || /[.!?]$/.test(textBuffer)) {
      flushBuffer();
    }
  }
};

// --------------------
// AUTO RECONNECT
// --------------------
recognition.onend = function() {
  if (isListening) {
    setTimeout(() => {
      if (isListening) {
        try { recognition.start(); } catch (e) {}
      }
    }, 100);
  }
};

recognition.onerror = function(event) {
  console.warn("STT Error:", event.error);
  if (event.error === 'not-allowed') {
    alert("마이크 접근 권한이 거부되었습니다.");
    stopListening();
  }
};

// --------------------
// EXPORT SRT FILE
// --------------------
function exportSRT(mode) {
  if (subtitleRecords.length === 0) {
    alert("다운로드할 자막 데이터가 없습니다.");
    return;
  }

  let srtContent = "";

  subtitleRecords.forEach((item, i) => {
    srtContent += `${i + 1}\n`;
    srtContent += `${formatSRTTime(item.startMs)} --> ${formatSRTTime(item.endMs)}\n`;
    
    if (mode === 'ko') {
      srtContent += `${item.ko}\n\n`;
    } else if (mode === 'both') {
      srtContent += `${item.ko}\n`;
      if (item.trans) srtContent += `${item.trans}\n`;
      srtContent += `\n`;
    }
  });

  const blob = new Blob([srtContent], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `KIZPOP_Subtitle_${Date.now()}.srt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
