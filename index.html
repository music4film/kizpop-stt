<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>KIZPOP STT & TRANSLATOR ULTRA v11.1</title>
<style type="text/css">
* {
  box-sizing: border-box;
}

body {
  background: #0f0f0f;
  color: #ffffff;
  font-family: 'Pretendard', Arial, sans-serif;
  padding: 15px;
  margin: 0;
}

/* TITLE */
h2 {
  margin-top: 5px;
  margin-bottom: 8px;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 0.6px;
  color: #ffffff;
  text-align: center;
}

h2::before {
  content: "● ";
  color: #ff3d00;
}

/* CONTROLS & STATUS */
.status-bar {
  text-align: center;
  margin-bottom: 15px;
}

.status {
  font-size: 13px;
  opacity: 0.75;
  margin-bottom: 10px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  background: #2a2a2a;
  color: #fff;
  border: 1px solid #444;
  padding: 9px 16px;
  font-size: 13px;
  font-weight: bold;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.2s;
}

.btn:hover {
  background: #3a3a3a;
}

.btn-toggle {
  background: #ff3d00;
  border: none;
}

.btn-toggle.active {
  background: #00c853;
}

.btn-download {
  background: #2962ff;
  border: none;
}

.btn-download:hover {
  background: #1e88e5;
}

.btn-dict {
  background: #ab47bc;
  border: none;
}

.btn-dict:hover {
  background: #8e24aa;
}

.btn-phono {
  background: #f57c00;
  border: none;
}

.btn-phono.active {
  background: #e65100;
  box-shadow: 0 0 8px rgba(255, 152, 0, 0.6);
}

.lang-select {
  background: #2a2a2a;
  color: #fff;
  border: 1px solid #444;
  padding: 9px 14px;
  font-size: 13px;
  border-radius: 20px;
  outline: none;
  cursor: pointer;
}

/* DICTIONARY PANEL */
#dictModal {
  display: none;
  max-width: 1200px;
  margin: 10px auto 15px auto;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 15px;
}

.dict-form {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.dict-input {
  background: #2a2a2a;
  border: 1px solid #444;
  color: #fff;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  flex: 1;
  min-width: 140px;
}

.dict-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  max-height: 120px;
  overflow-y: auto;
}

.dict-item {
  background: #2d2d2d;
  border: 1px solid #444;
  padding: 4px 10px;
  border-radius: 15px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.dict-item .del-btn {
  color: #ff5252;
  cursor: pointer;
  font-weight: bold;
}

/* TWO COLUMN DUAL DISPLAY GRID */
.main-display {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  max-width: 1400px;
  margin: 0 auto;
}

@media (max-width: 768px) {
  .main-display {
    grid-template-columns: 1fr;
  }
}

.panel {
  display: flex;
  flex-direction: column;
  background: #141414;
  border: 1px solid #333;
  border-radius: 10px;
  overflow: hidden;
  height: 580px;
}

.panel-header {
  background: #1f1f1f;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: bold;
  border-bottom: 1px solid #333;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.panel-header .badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 10px;
  background: #333;
  color: #ffca28;
}

.lines-box {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* CAPTION LINE STYLE */
.line {
  background: #1e1e1e;
  color: #ffffff;
  padding: 12px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
  font-size: 17px;
  line-height: 1.4;
  white-space: pre-line;
  word-break: keep-all;
  position: relative;
  min-height: 55px;
}

.line:hover {
  background: #2962ff;
}

.time-tag {
  font-size: 11px;
  color: #ff3d00;
  font-weight: bold;
  margin-bottom: 5px;
  display: block;
}

.trans-content {
  display: block;
  color: #ffca28;
  font-size: 16px;
}

.phono-text {
  display: block;
  font-size: 13px;
  color: #00e676;
  margin-top: 6px;
  font-weight: normal;
  background: rgba(0, 230, 118, 0.08);
  padding: 4px 8px;
  border-radius: 4px;
  border-left: 2px solid #00e676;
}

.copied {
  background: #00c853 !important;
}

.new {
  outline: 2px solid #ffaa00;
}

.live {
  opacity: 0.55;
  font-style: italic;
  border-left: 3px solid #ff3d00;
  padding-left: 10px;
  background: transparent;
}

.loading-text {
  opacity: 0.5;
  font-size: 13px;
  font-style: italic;
}

<body>

<h2><span style="color:#999999;">KIZPOP STT & TRANSLATOR ULTRA v11.1</span></h2>

<div class="status-bar">

      <option value="ru">러시아어 (Русский)</option>
      <option value="it">이탈리아어 (Italiano)</option>
      <option value="pt">포르투갈어 (Português)</option>
      <option value="hi">힌디어 (हिन्दी)</option>
      <option value="tr">터키어 (Türkçe)</option>
      <option value="nl">네덜란드어 (Nederlands)</option>
      <option value="pl">폴란드어 (Polski)</option>
      <option value="sv">스웨덴어 (Svenska)</option>
      <option value="uk">우크라이나어 (Українська)</option>
      <option value="mn">몽골어 (Монгол)</option>
    </select>
    <button id="phonoBtn" class="btn btn-phono" onclick="togglePhonetic()">한글 발음 표기 [OFF]</button>
    <button class="btn btn-dict" onclick="toggleDictUI()">교정 사전 설정</button>
    <button class="btn btn-download" onclick="exportSRT('ko')">SRT 받기 (원문)</button>
    <button class="btn btn-download" onclick="exportSRT('both')">SRT 받기 (통합)</button>
    <button class="btn" onclick="clearAllData()">초기화</button>
  </div>
</div>

<!-- CUSTOM DICTIONARY UI -->
<div id="dictModal">
  <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #ab47bc;">오인식 교정 사전 관리 (브라우저 자동 저장)</div>
  <div class="dict-form">
    <input type="text" id="wrongWord" class="dict-input" placeholder="틀린/잘못 들린 단어 (예: 아버지 가방에)">
    <input type="text" id="rightWord" class="dict-input" placeholder="올바른 단어 (예: 아버지가 방에)">
    <button class="btn" style="padding: 6px 14px; font-size: 12px;" onclick="addDictRule()">추가</button>
  </div>
  <div id="dictList" class="dict-list"></div>
</div>

<!-- DUAL COLUMN DISPLAY -->
<div class="main-display">
  <!-- LEFT: KOREAN STT -->
  <div class="panel">
    <div class="panel-header">
      <span>🎙️ 한국어 원문 자막</span>
      <span class="badge">KO-KR</span>
    </div>
    <div id="linesKo" class="lines-box"></div>
  </div>

  <!-- RIGHT: TRANSLATED TEXT -->
  <div class="panel">
    <div class="panel-header">
      <span>🌐 번역 선택 언어 창</span>
      <span id="targetLangBadge" class="badge">English</span>
    </div>
    <div id="linesTrans" class="lines-box"></div>
  </div>
</div>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  alert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 또는 Edge 브라우저를 사용해 주세요.");
}

const recognition = new SpeechRecognition();
recognition.lang = "ko-KR";
recognition.continuous = true;
recognition.interimResults = true;
recognition.maxAlternatives = 1;

let isListening = false;
let textBuffer = "";
let liveLineKo = null;
let liveLineTrans = null;
let autoScroll = true;
let isPhoneticEnabled = false;

let sessionStartTime = 0;
let chunkStartTime = 0;
let subtitleRecords = [];

const linesKoDiv = document.getElementById("linesKo");
const linesTransDiv = document.getElementById("linesTrans");
const startBtn = document.getElementById("startBtn");
const targetLangSelect = document.getElementById("targetLang");
const targetLangBadge = document.getElementById("targetLangBadge");
const phonoBtn = document.getElementById("phonoBtn");

// --------------------------------------------------
// CUSTOM DICTIONARY SYSTEM
// --------------------------------------------------
const defaultDict = {
  "아버지 가방에": "아버지가 방에",
  "키즘팝": "키즈팝",
  "키즈 팝": "키즈팝",
  "보스샘": "뽀스쌤",
  "보스 쌤": "뽀스쌤",
  "안선우": "안선우",
  "베가스": "Vegas",
  "프리미어": "Premiere"
};

let customDictionary = JSON.parse(localStorage.getItem("kizpop_dict")) || defaultDict;

function saveDict() {
  localStorage.setItem("kizpop_dict", JSON.stringify(customDictionary));
  renderDict();
}

function toggleDictUI() {
  const modal = document.getElementById("dictModal");
  modal.style.display = (modal.style.display === "block") ? "none" : "block";
}

function renderDict() {
  const listDiv = document.getElementById("dictList");
  listDiv.innerHTML = "";
  for (const [wrong, right] of Object.entries(customDictionary)) {
    const item = document.createElement("div");
    item.className = "dict-item";
    item.innerHTML = `<span>${wrong} → <b style="color:#00c853;">${right}</b></span> <span class="del-btn" onclick="removeDictRule('${wrong}')">✕</span>`;
    listDiv.appendChild(item);
  }
}

function addDictRule() {
  const wrong = document.getElementById("wrongWord").value.trim();
  const right = document.getElementById("rightWord").value.trim();
  if (!wrong || !right) {
    alert("틀린 단어와 올바른 단어를 모두 입력해 주세요.");
    return;
  }
  customDictionary[wrong] = right;
  document.getElementById("wrongWord").value = "";
  document.getElementById("rightWord").value = "";
  saveDict();
}

function removeDictRule(key) {
  delete customDictionary[key];
  saveDict();
}

function applyCustomCorrections(text) {
  let corrected = text;
  for (const [wrong, right] of Object.entries(customDictionary)) {
    corrected = corrected.replaceAll(wrong, right);
  }
  return corrected;
}

renderDict();

// --------------------------------------------------
// SCROLL SYNC & TOGGLES
// --------------------------------------------------
linesKoDiv.addEventListener("scroll", () => {
  const bottom = linesKoDiv.scrollHeight - linesKoDiv.scrollTop - linesKoDiv.clientHeight;
  autoScroll = bottom < 120;
  linesTransDiv.scrollTop = linesKoDiv.scrollTop;
});

linesTransDiv.addEventListener("scroll", () => {
  linesKoDiv.scrollTop = linesTransDiv.scrollTop;
});

function togglePhonetic() {
  isPhoneticEnabled = !isPhoneticEnabled;
  if (isPhoneticEnabled) {
    phonoBtn.innerText = "한글 발음 표기 [ON]";
    phonoBtn.classList.add("active");
  } else {
    phonoBtn.innerText = "한글 발음 표기 [OFF]";
    phonoBtn.classList.remove("active");
  }
  reRenderAllTranslations();
}

function onLangChange() {
  const selectedText = targetLangSelect.options[targetLangSelect.selectedIndex].text;
  targetLangBadge.innerText = selectedText.split(' ')[0];
  reRenderAllTranslations();
}

// --------------------------------------------------
// STT CONTROL
// --------------------------------------------------
function toggleSTT() {
  if (isListening) {
    stopListening();
  } else {
    startListening();
  }
}

function startListening() {
  try {
    if (sessionStartTime === 0) {
      sessionStartTime = Date.now();
    }
    chunkStartTime = Date.now() - sessionStartTime;
    recognition.start();
    isListening = true;
    startBtn.innerText = "음성 인식 중 (정지)";
    startBtn.classList.add("active");
  } catch (e) {
    console.error("STT Start Error:", e);
  }
}

function stopListening() {
  isListening = false;
  recognition.stop();
  flushBuffer();
  startBtn.innerText = "음성 인식 시작";
  startBtn.classList.remove("active");
}

function clearAllData() {
  if (confirm("모든 자막과 타임코드 데이터를 초기화하시겠습니까?")) {
    linesKoDiv.innerHTML = "";
    linesTransDiv.innerHTML = "";
    subtitleRecords = [];
    sessionStartTime = 0;
    textBuffer = "";
  }
}

// --------------------------------------------------
// LIVE DISPLAY
// --------------------------------------------------
function showLive(text) {
  const corrected = applyCustomCorrections(text);
  
  if (!liveLineKo) {
    liveLineKo = document.createElement("div");
    liveLineKo.className = "line live";
    linesKoDiv.appendChild(liveLineKo);
  }
  liveLineKo.innerText = corrected;

  if (!liveLineTrans) {
    liveLineTrans = document.createElement("div");
    liveLineTrans.className = "line live";
    linesTransDiv.appendChild(liveLineTrans);
  }
  liveLineTrans.innerText = "(실시간 음성 수집 중...)";

  if (autoScroll) {
    linesKoDiv.scrollTop = linesKoDiv.scrollHeight;
    linesTransDiv.scrollTop = linesTransDiv.scrollHeight;
  }
}

function clearLive() {
  if (liveLineKo) {
    liveLineKo.remove();
    liveLineKo = null;
  }
  if (liveLineTrans) {
    liveLineTrans.remove();
    liveLineTrans = null;
  }
}

// --------------------------------------------------
// TRANSLATION ENGINE
// --------------------------------------------------
async function fetchTranslation(text, targetLang) {
  if (!targetLang || targetLang === "none" || !text.trim()) return "";
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
    const response = await fetch(url);
    const data = await response.json();
    return data[0].map(item => item[0]).join('');
  } catch (error) {
    console.error("Translation Error:", error);
    return "";
  }
}

// --------------------------------------------------
// HANGUL PHONETIC TRANSLITERATION ENGINE
// --------------------------------------------------
const kanaToHangulMap = {
  'あ':'아','い':'이','う':'우','え':'에','お':'오',
  'か':'카','き':'키','く':'쿠','け':'케','こ':'코',
  'さ':'사','し':'시','す':'스','せ':'세','そ':'소',
  'た':'타','ち':'치','つ':'츠','て':'테','と':'토',
  'な':'나','に':'니','ぬ':'누','ね':'네','の':'노',
  'は':'하','ひ':'히','ふ':'후','へ':'헤','ほ':'호',
  'ま':'마','み':'미','む':'무','め':'메','も':'모',
  'や':'야','ゆ':'유','よ':'요',
  'ら':'라','り':'리','る':'루','れ':'레','ろ':'로',
  'わ':'와','を':'오','ん':'응',
  'が':'가','ぎ':'기','ぐ':'구','げ':'게','ご':'고',
  'ざ':'자','じ':'지','ず':'즈','ぜ':'제','ぞ':'조',
  'だ':'다','ぢ':'지','づ':'즈','で':'데','ど':'도',
  'ば':'바','び':'비','ぶ':'부','べ':'베','ぼ':'보',
  'ぱ':'파','ぴ':'피','ぷ':'푸','ぺ':'페','ぽ':'포',
  'ア':'아','イ':'이','ウ':'우','エ':'에','オ':'오',
  'カ':'카','キ':'키','ク':'쿠','ケ':'케','コ':'코',
  'サ':'사','シ':'시','ス':'스','セ':'세','ソ':'소',
  'タ':'타','チ':'치','ツ':'츠','テ':'테','ト':'토',
  'ナ':'나','ニ':'니','ヌ':'누','ネ':'네','ノ':'노',
  'ハ':'하','ヒ':'히','フ':'후','ヘ':'헤','ホ':'호',
  'マ':'마','ミ':'미','ム':'무','メ':'메','モ':'모',
  'ヤ':'야','ユ':'유','ヨ':'요',
  'ラ':'라','リ':'리','ル':'루','レ':'레','ロ':'로',
  'ワ':'와','ヲ':'오','ン':'응'
};

const enPhoneticDict = {
  "hi": "하이", "hello": "헬로", "hey": "헤이", "good": "굿", "morning": "모닝",
  "afternoon": "애프터눈", "evening": "이브닝", "night": "나이트", "bye": "바이",
  "goodbye": "굿바이", "see": "시", "you": "유", "later": "레이터", "thank": "탱크",
  "thanks": "탱크스", "welcome": "웰컴", "please": "플리즈", "sorry": "소리",
  "yes": "예스", "no": "노", "ok": "오케이", "okay": "오케이", "what": "왓",
  "where": "웨어", "when": "웬", "why": "와이", "how": "하우", "who": "후",
  "nice": "나이스", "meet": "미트", "love": "러브", "like": "라이크",
  "friend": "프렌드", "music": "뮤직", "song": "송", "teacher": "티처",
  "boss": "뽀스", "kizpop": "키즈팝", "i": "아이", "my": "마이", "me": "미",
  "your": "유어", "he": "히", "she": "쉬", "we": "위", "they": "데이",
  "is": "이즈", "am": "앰", "are": "아", "do": "두", "can": "캔", "will": "윌",
  "have": "해브", "go": "고", "come": "컴", "want": "원트", "think": "씽크"
};

function convertEnglishToHangulPhonetic(transText) {
  if (!transText) return "";
  const words = transText.split(/\s+/);
  
  return words.map(rawWord => {
    const cleanWord = rawWord.toLowerCase().replace(/[^a-z]/g, '');
    const punctuation = rawWord.replace(/[a-zA-Z]/g, '');

    if (enPhoneticDict[cleanWord]) {
      return enPhoneticDict[cleanWord] + punctuation;
    }

    let w = cleanWord;
    if (!w) return rawWord;

    w = w.replace(/tion/g, "션").replace(/sion/g, "션")
         .replace(/th/g, "쓰").replace(/sh/g, "쉬")
         .replace(/ch/g, "치").replace(/ph/g, "프")
         .replace(/ck/g, "크").replace(/ng/g, "잉")
         .replace(/ee/g, "이").replace(/ea/g, "이")
         .replace(/oo/g, "우").replace(/ou/g, "아우")
         .replace(/ow/g, "아우").replace(/ai/g, "에이")
         .replace(/ay/g, "에이").replace(/oa/g, "오")
         .replace(/ar/g, "아").replace(/or/g, "오")
         .replace(/er/g, "어").replace(/ir/g, "어")
         .replace(/ur/g, "어");

    let res = "";
    for (let i = 0; i < w.length; i++) {
      const char = w[i];
      if (/[가-힣]/.test(char)) { res += char; continue; }
      switch(char) {
        case 'a': res += "아"; break;
        case 'b': res += "브"; break;
        case 'c': res += "크"; break;
        case 'd': res += "드"; break;
        case 'e': res += "에"; break;
        case 'f': res += "프"; break;
        case 'g': res += "그"; break;
        case 'h': res += "흐"; break;
        case 'i': res += "이"; break;
        case 'j': res += "제이"; break;
        case 'k': res += "크"; break;
        case 'l': res += "엘"; break;
        case 'm': res += "엠"; break;
        case 'n': res += "엔"; break;
        case 'o': res += "오"; break;
        case 'p': res += "프"; break;
        case 'q': res += "큐"; break;
        case 'r': res += "알"; break;
        case 's': res += "스"; break;
        case 't': res += "트"; break;
        case 'u': res += "우"; break;
        case 'v': res += "브"; break;
        case 'w': res += "우"; break;
        case 'x': res += "엑스"; break;
        case 'y': res += "와이"; break;
        case 'z': res += "즈"; break;
        default: res += char;
      }
    }
    return res + punctuation;
  }).join(" ");
}

async function fetchPhonetic(transText, targetLang) {
  if (!transText || !transText.trim()) return "";

  if (targetLang === "ja") {
    let result = "";
    for (let char of transText) {
      result += kanaToHangulMap[char] || char;
    }
    if (result !== transText) return result;
  }

  if (targetLang === "en" || /[a-zA-Z]/.test(transText)) {
    return convertEnglishToHangulPhonetic(transText);
  }

  return "";
}

// --------------------------------------------------
// SMART KOREAN SPLIT ENGINE
// --------------------------------------------------
function smartKoreanSplit(text) {
  const TARGET_LEN = 14;
  const MAX_LEN = 20;
  const words = text.split(/\s+/);
  const result = [];
  let current = "";

  const breakPattern = /(은|는|이|가|을|를|에서|에|과|와|으로|로|하고|는데|이고|해서|하며|있어|했습니다|입니다|[.,?!~])$/;

  for (let i = 0; i < words.length; i++) {
    const word = words[i];
    const candidate = (current + " " + word).trim();

    if (candidate.length > MAX_LEN) {
      if (current) result.push(current);
      current = word;
      continue;
    }

    if (candidate.length >= TARGET_LEN && breakPattern.test(word) && i < words.length - 1) {
      result.push(candidate);
      current = "";
      continue;
    }

    current = candidate;
  }

  if (current) result.push(current);
  return result;
}

// --------------------------------------------------
// TIME FORMATTER
// --------------------------------------------------
function formatSRTTime(ms) {
  let hrs = Math.floor(ms / 3600000);
  let mins = Math.floor((ms % 3600000) / 60000);
  let secs = Math.floor((ms % 60000) / 1000);
  let millis = Math.floor(ms % 1000);

  return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')},${String(millis).padStart(3, '0')}`;
}

// --------------------------------------------------
// LINE CREATION & STRICT TIMELINE SYNCHRONIZATION
// --------------------------------------------------
async function createLine(text, startMs, endMs) {
  if (!text || !text.trim()) return;

  const recordIndex = subtitleRecords.length;
  const timeFormatted = `[${formatSRTTime(startMs)} --> ${formatSRTTime(endMs)}]`;

  const record = {
    index: recordIndex + 1,
    startMs: startMs,
    endMs: endMs,
    ko: text,
    trans: "",
    phono: ""
  };
  subtitleRecords.push(record);

  const koDiv = document.createElement("div");
  koDiv.className = "line new";
  koDiv.id = `ko-line-${recordIndex}`;
  koDiv.innerHTML = `<span class="time-tag">${timeFormatted}</span>${text}`;
  koDiv.onclick = () => copyText(koDiv, text);
  linesKoDiv.appendChild(koDiv);

  const transDiv = document.createElement("div");
  transDiv.className = "line new";
  transDiv.id = `trans-line-${recordIndex}`;
  transDiv.innerHTML = `<span class="time-tag">${timeFormatted}</span><span class="loading-text">번역 불러오는 중...</span>`;
  linesTransDiv.appendChild(transDiv);

  if (autoScroll) {
    linesKoDiv.scrollTop = linesKoDiv.scrollHeight;
    linesTransDiv.scrollTop = linesTransDiv.scrollHeight;
  }

  setTimeout(() => {
    koDiv.classList.remove("new");
    transDiv.classList.remove("new");
  }, 800);

  const selectedLang = targetLangSelect.value;
  if (selectedLang !== "none") {
    const transText = await fetchTranslation(text, selectedLang);
    record.trans = transText;

    let phonoText = "";
    if (isPhoneticEnabled && transText) {
      phonoText = await fetchPhonetic(transText, selectedLang);
      record.phono = phonoText;
    }

    updateTransLineUI(recordIndex);
  } else {
    transDiv.innerHTML = `<span class="time-tag">${timeFormatted}</span><span class="trans-content" style="opacity:0.4;">(번역 안 함)</span>`;
    transDiv.onclick = () => copyText(transDiv, text);
  }
}

function updateTransLineUI(index) {
  const record = subtitleRecords[index];
  const transDiv = document.getElementById(`trans-line-${index}`);
  if (!transDiv || !record) return;

  const timeFormatted = `[${formatSRTTime(record.startMs)} --> ${formatSRTTime(record.endMs)}]`;
  let contentHtml = `<span class="time-tag">${timeFormatted}</span>`;

  if (record.trans) {
    contentHtml += `<span class="trans-content">${record.trans}</span>`;
    if (isPhoneticEnabled && record.phono) {
      contentHtml += `<span class="phono-text">🗣️ [발음] ${record.phono}</span>`;
    }
  } else {
    contentHtml += `<span class="trans-content" style="opacity:0.4;">-</span>`;
  }

  transDiv.innerHTML = contentHtml;
  transDiv.onclick = () => copyText(transDiv, `${record.trans}\n${record.phono ? '[발음] ' + record.phono : ''}`);
}

async function reRenderAllTranslations() {
  const selectedLang = targetLangSelect.value;
  for (let i = 0; i < subtitleRecords.length; i++) {
    const record = subtitleRecords[i];
    if (selectedLang !== "none" && record.ko) {
      record.trans = await fetchTranslation(record.ko, selectedLang);
      if (isPhoneticEnabled && record.trans) {
        record.phono = await fetchPhonetic(record.trans, selectedLang);
      } else {
        record.phono = "";
      }
    } else {
      record.trans = "";
      record.phono = "";
    }
    updateTransLineUI(i);
  }
}

function copyText(elem, text) {
  navigator.clipboard.writeText(text).then(() => {
    elem.classList.add("copied");
    setTimeout(() => elem.classList.remove("copied"), 500);
  });
}

// --------------------------------------------------
// SILENCE-AWARE OUT-POINT CUT ALGORITHM
// --------------------------------------------------
function flushBuffer() {
  if (textBuffer.trim().length === 0) return;

  let finalText = applyCustomCorrections(textBuffer.trim());
  textBuffer = "";

  const chunkEndMs = Date.now() - sessionStartTime;
  const lines = smartKoreanSplit(finalText);

  const totalDuration = Math.max(chunkEndMs - chunkStartTime, 1000);
  const totalChars = lines.reduce((sum, line) => sum + line.length, 0) || 1;

  let currentStart = chunkStartTime;

  lines.forEach((lineText) => {
    const charRatio = lineText.length / totalChars;
    let rawDuration = totalDuration * charRatio;

    let maxVoiceDuration = (lineText.length * 200) + 350;
    let lineDuration = Math.min(rawDuration, maxVoiceDuration);
    lineDuration = Math.max(lineDuration, 800);

    let lineEnd = currentStart + Math.round(lineDuration);
    if (lineEnd > chunkEndMs) lineEnd = chunkEndMs;

    createLine(lineText, currentStart, lineEnd);

    currentStart = lineEnd + 50;
  });

  chunkStartTime = chunkEndMs;
  clearLive();
}

// --------------------------------------------------
// STT RESULT HANDLER
// --------------------------------------------------
recognition.onresult = function(event) {
  for (let i = event.resultIndex; i < event.results.length; i++) {
    let transcript = event.results[i][0].transcript.trim();

    if (!event.results[i].isFinal) {
      showLive(transcript);
      continue;
    }

    clearLive();
    textBuffer += " " + transcript;
    textBuffer = textBuffer.trim();

    if (textBuffer.length > 18 || /[.!?]$/.test(textBuffer)) {
      flushBuffer();
    }
  }
};

// --------------------------------------------------
// AUTO RECONNECT & ERROR HANDLER
// --------------------------------------------------
recognition.onend = function() {
  if (isListening) {
    setTimeout(() => {
      if (isListening) {
        try { recognition.start(); } catch (e) {}
      }
    }, 100);
  }
};

recognition.onerror = function(event) {
  console.warn("STT Error:", event.error);
  if (event.error === 'not-allowed') {
    alert("마이크 접근 권한이 거부되었습니다.");
    stopListening();
  }
};

// --------------------------------------------------
// EXPORT SRT FILE
// --------------------------------------------------
function exportSRT(mode) {
  if (subtitleRecords.length === 0) {
    alert("다운로드할 자막 데이터가 없습니다.");
    return;
  }

  let srtContent = "";

  subtitleRecords.forEach((item, i) => {
    srtContent += `${i + 1}\n`;
    srtContent += `${formatSRTTime(item.startMs)} --> ${formatSRTTime(item.endMs)}\n`;
    
    if (mode === 'ko') {
      srtContent += `${item.ko}\n\n`;
    } else if (mode === 'both') {
      srtContent += `${item.ko}\n`;
      if (item.trans) srtContent += `${item.trans}\n`;
      if (item.phono) srtContent += `[발음] ${item.phono}\n`;
      srtContent += `\n`;
    }
  });

  const blob = new Blob([srtContent], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `KIZPOP_Subtitle_${Date.now()}.srt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
