<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIZPOP STT FINAL ULTRA v6</title>
<style type="text/css">
body {
  background: #0f0f0f;
  color: #ffffff;
  font-family: 'Pretendard', Arial, sans-serif;
  padding: 20px;
  margin: 0;
}

/* TITLE */
h2 {
  margin-bottom: 8px;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 0.6px;
  color: #ffffff;
  text-align: center;
}

h2::before {
  content: "● ";
  color: #ff3d00;
}

/* CONTROLS & STATUS */
.status-bar {
  text-align: center;
  margin-bottom: 15px;
}

.status {
  font-size: 13px;
  opacity: 0.75;
  margin-bottom: 10px;
}

.btn-toggle {
  background: #ff3d00;
  color: #fff;
  border: none;
  padding: 10px 24px;
  font-size: 15px;
  font-weight: bold;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.2s;
}

.btn-toggle.active {
  background: #00c853;
}

/* TEXT AREA */
#lines {
  margin-top: 15px;
  max-width: 900px;
  height: 540px;
  overflow-y: auto;
  border: 1px solid #333;
  padding: 15px;
  margin-left: auto;
  margin-right: auto;
  border-radius: 8px;
  background: #141414;
}

/* CAPTION LINE */
.line {
  background: #1e1e1e;
  color: #ffffff;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: background 0.15s;
  font-size: 18px;
  line-height: 1.4;
  white-space: pre-line;
  word-break: keep-all;
}

.line:hover {
  background: #2962ff;
}

.copied {
  background: #00c853 !important;
}

.new {
  outline: 2px solid #ffaa00;
}

.live {
  opacity: 0.5;
  font-style: italic;
  border-left: 3px solid #ff3d00;
  padding-left: 10px;
  background: transparent;
}
</style>
</head>
<body>

<h2><span style="color:#999999;">KIZPOP STT FINAL ULTRA v6</span></h2>

<div class="status-bar">
  <div class="status">Real-time STT / Click line &rarr; Copy &rarr; Vegas Paste</div>
  <button id="startBtn" class="btn-toggle" onclick="toggleSTT()">음성 인식 시작</button>
</div>

<div id="lines"></div>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  alert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 또는 Edge 브라우저를 사용해 주세요.");
}

const recognition = new SpeechRecognition();
recognition.lang = "ko-KR";
recognition.continuous = true;
recognition.interimResults = true;
recognition.maxAlternatives = 1;

let isListening = false;
let textBuffer = "";
let liveLine = null;
let autoScroll = true;

const linesDiv = document.getElementById("lines");
const startBtn = document.getElementById("startBtn");

// --------------------
// USER SCROLL LOCK
// --------------------
linesDiv.addEventListener("scroll", () => {
  const bottom = linesDiv.scrollHeight - linesDiv.scrollTop - linesDiv.clientHeight;
  autoScroll = bottom < 120;
});

// --------------------
// STT START / STOP TOGGLE
// --------------------
function toggleSTT() {
  if (isListening) {
    stopListening();
  } else {
    startListening();
  }
}

function startListening() {
  try {
    recognition.start();
    isListening = true;
    startBtn.innerText = "음성 인식 중 (클릭하여 정지)";
    startBtn.classList.add("active");
  } catch (e) {
    console.error("STT Start Error:", e);
  }
}

function stopListening() {
  isListening = false;
  recognition.stop();
  flushBuffer();
  startBtn.innerText = "음성 인식 시작";
  startBtn.classList.remove("active");
}

// --------------------
// LIVE TEXT DISPLAY
// --------------------
function showLive(text) {
  if (!liveLine) {
    liveLine = document.createElement("div");
    liveLine.className = "line live";
    linesDiv.appendChild(liveLine);
  }
  liveLine.innerText = text;

  if (autoScroll) {
    linesDiv.scrollTop = linesDiv.scrollHeight;
  }
}

function clearLive() {
  if (liveLine) {
    liveLine.remove();
    liveLine = null;
  }
}

// --------------------
// SMART KOREAN SPLIT ENGINE (Vegas 자막용)
// --------------------
function splitText(text) {
  const MAX_LEN = 16; // 한 자막당 최대 자수 (Vegas 가독성 기준)
  const words = text.split(/\s+/);
  const result = [];
  let current = "";

  words.forEach(word => {
    if ((current + " " + word).trim().length > MAX_LEN) {
      if (current) result.push(current.trim());
      current = word;
    } else {
      current = (current + " " + word).trim();
    }
  });

  if (current) {
    result.push(current.trim());
  }

  return result;
}

// --------------------
// LINE CREATION & CLIPBOARD
// --------------------
function createLine(text) {
  if (!text || text.trim() === "") return;

  let div = document.createElement("div");
  div.className = "line new";
  div.innerText = text;

  div.onclick = function() {
    navigator.clipboard.writeText(text).then(() => {
      div.classList.add("copied");
      setTimeout(() => div.classList.remove("copied"), 500);
    });
  };

  linesDiv.appendChild(div);
  setTimeout(() => div.classList.remove("new"), 800);

  if (autoScroll) {
    linesDiv.scrollTop = linesDiv.scrollHeight;
  }
}

// --------------------
// BUFFER FLUSH
// --------------------
function flushBuffer() {
  if (textBuffer.trim().length === 0) return;

  let finalText = textBuffer.trim();
  textBuffer = "";

  let lines = splitText(finalText);
  lines.forEach(t => createLine(t));

  clearLive();
}

// --------------------
// STT RESULT HANDLER
// --------------------
recognition.onresult = function(event) {
  for (let i = event.resultIndex; i < event.results.length; i++) {
    let transcript = event.results[i][0].transcript.trim();

    if (!event.results[i].isFinal) {
      showLive(transcript);
      continue;
    }

    clearLive();
    textBuffer += " " + transcript;
    textBuffer = textBuffer.trim();

    // 18자 이상이거나 마침표/물음표가 있을 때 자막 분할 출력
    if (textBuffer.length > 18 || /[.!?]$/.test(textBuffer)) {
      flushBuffer();
    }
  }
};

// --------------------
// AUTO RECONNECT (크롬 자동 끊김 방지)
// --------------------
recognition.onend = function() {
  if (isListening) {
    // 크롬 특성상 일정 무음 후 자동 종료되므로 사용자가 끄지 않았다면 재시작
    setTimeout(() => {
      if (isListening) {
        try { recognition.start(); } catch (e) {}
      }
    }, 100);
  }
};

recognition.onerror = function(event) {
  console.warn("STT Error:", event.error);
  if (event.error === 'not-allowed') {
    alert("마이크 접근 권한이 거부되었습니다. 브라우저 주소창 왼쪽의 마이크 허용 설정을 확인해 주세요.");
    stopListening();
  }
};
</script>
</body>
</html>
