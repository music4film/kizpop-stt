<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIZPOP STT & TRANSLATOR ULTRA v8</title>
<style type="text/css">
body {
  background: #0f0f0f;
  color: #ffffff;
  font-family: 'Pretendard', Arial, sans-serif;
  padding: 20px;
  margin: 0;
}

/* TITLE */
h2 {
  margin-bottom: 8px;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 0.6px;
  color: #ffffff;
  text-align: center;
}

h2::before {
  content: "● ";
  color: #ff3d00;
}

/* CONTROLS & STATUS */
.status-bar {
  text-align: center;
  margin-bottom: 15px;
}

.status {
  font-size: 13px;
  opacity: 0.75;
  margin-bottom: 10px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  background: #2a2a2a;
  color: #fff;
  border: 1px solid #444;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: bold;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.2s;
}

.btn:hover {
  background: #3a3a3a;
}

.btn-toggle {
  background: #ff3d00;
  border: none;
}

.btn-toggle.active {
  background: #00c853;
}

.btn-download {
  background: #2962ff;
  border: none;
}

.btn-download:hover {
  background: #1e88e5;
}

.lang-select {
  background: #2a2a2a;
  color: #fff;
  border: 1px solid #444;
  padding: 9px 16px;
  font-size: 14px;
  border-radius: 20px;
  outline: none;
  cursor: pointer;
}

/* TEXT AREA */
#lines {
  margin-top: 15px;
  max-width: 900px;
  height: 520px;
  overflow-y: auto;
  border: 1px solid #333;
  padding: 15px;
  margin-left: auto;
  margin-right: auto;
  border-radius: 8px;
  background: #141414;
}

/* CAPTION LINE */
.line {
  background: #1e1e1e;
  color: #ffffff;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: background 0.15s;
  font-size: 18px;
  line-height: 1.4;
  white-space: pre-line;
  word-break: keep-all;
  position: relative;
}

.line:hover {
  background: #2962ff;
}

.time-tag {
  font-size: 11px;
  color: #ff3d00;
  font-weight: bold;
  margin-bottom: 4px;
  display: block;
}

.trans-text {
  display: block;
  font-size: 14px;
  color: #ffca28;
  margin-top: 4px;
  font-weight: normal;
}

.copied {
  background: #00c853 !important;
}

.new {
  outline: 2px solid #ffaa00;
}

.live {
  opacity: 0.5;
  font-style: italic;
  border-left: 3px solid #ff3d00;
  padding-left: 10px;
  background: transparent;
}
</style>
</head>
<body>

<h2><span style="color:#999999;">KIZPOP STT & TRANSLATOR ULTRA v8</span></h2>

<div class="status-bar">
  <div class="status">Real-time STT / Translation / Auto SRT Generator</div>
  <div class="controls">
    <button id="startBtn" class="btn btn-toggle" onclick="toggleSTT()">음성 인식 시작</button>
    <select id="targetLang" class="lang-select">
      <option value="none">번역 안 함 (한국어만)</option>
      <option value="en" selected>영어 (English)</option>
      <option value="ja">일본어 (日本語)</option>
      <option value="zh-CN">중국어 (簡體字)</option>
      <option value="es">스페인어 (Español)</option>
      <option value="fr">프랑스어 (Français)</option>
      <option value="vi">베트남어 (Tiếng Việt)</option>
    </select>
    <button class="btn btn-download" onclick="exportSRT('ko')">SRT 받기 (원문)</button>
    <button class="btn btn-download" onclick="exportSRT('both')">SRT 받기 (통합)</button>
    <button class="btn" onclick="clearAllData()">초기화</button>
  </div>
</div>

<div id="lines"></div>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  alert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 또는 Edge 브라우저를 사용해 주세요.");
}

const recognition = new SpeechRecognition();
recognition.lang = "ko-KR";
recognition.continuous = true;
recognition.interimResults = true;
recognition.maxAlternatives = 1;

let isListening = false;
let textBuffer = "";
let liveLine = null;
let autoScroll = true;

let sessionStartTime = 0;
let chunkStartTime = 0;
let subtitleRecords = []; // SRT 저장용 데이터 배열

const linesDiv = document.getElementById("lines");
const startBtn = document.getElementById("startBtn");
const targetLangSelect = document.getElementById("targetLang");

// --------------------
// USER SCROLL LOCK
// --------------------
linesDiv.addEventListener("scroll", () => {
  const bottom = linesDiv.scrollHeight - linesDiv.scrollTop - linesDiv.clientHeight;
  autoScroll = bottom < 120;
});

// --------------------
// STT START / STOP TOGGLE
// --------------------
function toggleSTT() {
  if (isListening) {
    stopListening();
  } else {
    startListening();
  }
}

function startListening() {
  try {
    if (sessionStartTime === 0) {
      sessionStartTime = Date.now();
    }
    chunkStartTime = Date.now() - sessionStartTime;
    recognition.start();
    isListening = true;
    startBtn.innerText = "음성 인식 중 (정지)";
    startBtn.classList.add("active");
  } catch (e) {
    console.error("STT Start Error:", e);
  }
}

function stopListening() {
  isListening = false;
  recognition.stop();
  flushBuffer();
  startBtn.innerText = "음성 인식 시작";
  startBtn.classList.remove("active");
}

function clearAllData() {
  if (confirm("모든 자막과 타임코드 데이터를 초기화하시겠습니까?")) {
    linesDiv.innerHTML = "";
    subtitleRecords = [];
    sessionStartTime = 0;
    textBuffer = "";
  }
}

// --------------------
// LIVE TEXT DISPLAY
// --------------------
function showLive(text) {
  if (!liveLine) {
    liveLine = document.createElement("div");
    liveLine.className = "line live";
    linesDiv.appendChild(liveLine);
  }
  liveLine.innerText = text;

  if (autoScroll) {
    linesDiv.scrollTop = linesDiv.scrollHeight;
  }
}

function clearLive() {
  if (liveLine) {
    liveLine.remove();
    liveLine = null;
  }
}

// --------------------
// TRANSLATION ENGINE
// --------------------
async function fetchTranslation(text, targetLang) {
  if (!targetLang || targetLang === "none" || !text.trim()) return "";
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
    const response = await fetch(url);
    const data = await response.json();
    return data[0].map(item => item[0]).join('');
  } catch (error) {
    console.error("Translation Error:", error);
    return "";
  }
}

// --------------------
// SMART KOREAN SPLIT ENGINE
// --------------------
function splitText(text) {
  const MAX_LEN = 16;
  const words = text.split(/\s+/);
  const result = [];
  let current = "";

  words.forEach(word => {
    if ((current + " " + word).trim().length > MAX_LEN) {
      if (current) result.push(current.trim());
      current = word;
    } else {
      current = (current + " " + word).trim();
    }
  });

  if (current) result.push(current.trim());
  return result;
}

// --------------------
// TIMECODE FORMATTER (SRT Format: HH:MM:SS,mmm)
// --------------------
function formatSRTTime(ms) {
  let hrs = Math.floor(ms / 3600000);
  let mins = Math.floor((ms % 3600000) / 60000);
  let secs = Math.floor((ms % 60000) / 1000);
  let millis = Math.floor(ms % 1000);

  return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')},${String(millis).padStart(3, '0')}`;
}

// --------------------
// LINE CREATION & DATA RECORDING
// --------------------
async function createLine(text, startMs, endMs) {
  if (!text || text.trim() === "") return;

  const selectedLang = targetLangSelect.value;
  let transText = "";

  if (selectedLang !== "none") {
    transText = await fetchTranslation(text, selectedLang);
  }

  // 레코드 저장
  const record = {
    index: subtitleRecords.length + 1,
    startMs: startMs,
    endMs: endMs,
    ko: text,
    trans: transText
  };
  subtitleRecords.push(record);

  // 화면 요소 생성
  let div = document.createElement("div");
  div.className = "line new";

  let timeSpan = document.createElement("span");
  timeSpan.className = "time-tag";
  timeSpan.innerText = `[${formatSRTTime(startMs)} --> ${formatSRTTime(endMs)}]`;
  div.appendChild(timeSpan);

  let textNode = document.createTextNode(text);
  div.appendChild(textNode);

  if (transText) {
    let transSpan = document.createElement("span");
    transSpan.className = "trans-text";
    transSpan.innerText = transText;
    div.appendChild(transSpan);
  }

  // 클릭 시 원문 + 번역문 전체 복사
  div.onclick = function() {
    const copyContent = div.innerText;
    navigator.clipboard.writeText(copyContent).then(() => {
      div.classList.add("copied");
      setTimeout(() => div.classList.remove("copied"), 500);
    });
  };

  linesDiv.appendChild(div);
  setTimeout(() => div.classList.remove("new"), 800);

  if (autoScroll) {
    linesDiv.scrollTop = linesDiv.scrollHeight;
  }
}

// --------------------
// BUFFER FLUSH
// --------------------
function flushBuffer() {
  if (textBuffer.trim().length === 0) return;

  let finalText = textBuffer.trim();
  textBuffer = "";

  const chunkEndMs = Date.now() - sessionStartTime;
  const lines = splitText(finalText);

  // 분할된 라인별 시간 분배
  const totalDuration = Math.max(chunkEndMs - chunkStartTime, 1000);
  const lineDuration = totalDuration / lines.length;

  lines.forEach((t, idx) => {
    const lineStart = Math.round(chunkStartTime + (idx * lineDuration));
    const lineEnd = Math.round(chunkStartTime + ((idx + 1) * lineDuration));
    createLine(t, lineStart, lineEnd);
  });

  chunkStartTime = chunkEndMs; // 다음 청크 시작 시간 갱신
  clearLive();
}

// --------------------
// STT RESULT HANDLER
// --------------------
recognition.onresult = function(event) {
  for (let i = event.resultIndex; i < event.results.length; i++) {
    let transcript = event.results[i][0].transcript.trim();

    if (!event.results[i].isFinal) {
      showLive(transcript);
      continue;
    }

    clearLive();
    textBuffer += " " + transcript;
    textBuffer = textBuffer.trim();

    if (textBuffer.length > 18 || /[.!?]$/.test(textBuffer)) {
      flushBuffer();
    }
  }
};

// --------------------
// AUTO RECONNECT
// --------------------
recognition.onend = function() {
  if (isListening) {
    setTimeout(() => {
      if (isListening) {
        try { recognition.start(); } catch (e) {}
      }
    }, 100);
  }
};

recognition.onerror = function(event) {
  console.warn("STT Error:", event.error);
  if (event.error === 'not-allowed') {
    alert("마이크 접근 권한이 거부되었습니다.");
    stopListening();
  }
};

// --------------------
// EXPORT SRT FILE
// --------------------
function exportSRT(mode) {
  if (subtitleRecords.length === 0) {
    alert("다운로드할 자막 데이터가 없습니다.");
    return;
  }

  let srtContent = "";

  subtitleRecords.forEach((item, i) => {
    srtContent += `${i + 1}\n`;
    srtContent += `${formatSRTTime(item.startMs)} --> ${formatSRTTime(item.endMs)}\n`;
    
    if (mode === 'ko') {
      srtContent += `${item.ko}\n\n`;
    } else if (mode === 'both') {
      srtContent += `${item.ko}\n`;
      if (item.trans) srtContent += `${item.trans}\n`;
      srtContent += `\n`;
    }
  });

  const blob = new Blob([srtContent], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `KIZPOP_Subtitle_${Date.now()}.srt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
